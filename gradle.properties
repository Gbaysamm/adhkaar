# Modest limits so Android Studio, the build and everything else fit in 16 GB together.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Faster builds: reuse outputs and configure in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# The raw URL of app/src/main/assets/calendar/ng.json on the project's main branch, set once the
# repository is public, e.g. https://raw.githubusercontent.com/<owner>/adhkaar/main/app/src/main/assets/calendar/ng.json
adhkaar.moonSightingUrl=
# Where Contact us sends messages: the URL of the deployed tools/report-worker, e.g.
# https://adhkaar-report.<you>.workers.dev. Blank sends users to email (adhkaar.contactEmail) instead.
adhkaar.reportUrl=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
