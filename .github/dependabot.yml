version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      test:
        patterns: ["org.robolectric*", "io.github.takahirom.roborazzi*", "junit*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
