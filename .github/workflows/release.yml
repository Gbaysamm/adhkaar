# Builds a signed release when a version tag (v1.2.3) is pushed: an AAB for Google Play and an
# APK for GitHub Releases. See docs/RELEASING.md for the secrets and the steps around it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release # add required reviewers to this environment in the repository settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Test
        run: ./gradlew testDebugUnitTest -PnoScreens --stacktrace

      # Release has no signingConfig in Gradle, so these come out unsigned and are signed below.
      - name: Build release AAB and APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p dist

          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar "dist/adhkaar-$GITHUB_REF_NAME.aab" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

          "$build_tools/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "dist/adhkaar-$GITHUB_REF_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "dist/adhkaar-$GITHUB_REF_NAME.apk"

          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$GITHUB_REF_NAME.txt"
          (cd dist && sha256sum adhkaar-* > SHA256SUMS)
          rm "$RUNNER_TEMP/upload.jks"

      - name: Keep the mapping file and AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          retention-days: 90

      # A draft, so a maintainer pastes the changelog section and publishes it by hand.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Adhkaar $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md." \
            "dist/adhkaar-$GITHUB_REF_NAME.apk" dist/SHA256SUMS
