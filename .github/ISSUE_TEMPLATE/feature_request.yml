name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. The app will never include ads, tracking or anything that sends your data off the phone.
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: The problem or the moment in your day, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: Source, if it's about religious content
      description: For new adhkaar, duas or reminders, the book and number or another reliable source.
    validations:
      required: false
